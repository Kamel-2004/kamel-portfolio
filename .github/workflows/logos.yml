name: Update logo list
on:
  push:
    paths: ['photos/logos/**']
permissions:
  contents: write
jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write logo list
        run: |
          {
            echo 'window.DATA=window.DATA||{};DATA.logos=`'
            ls photos/logos | grep -iE '\.(png|jpe?g|svg|webp)$' | sort || true
            echo '`;'
          } > data/logos.js
      - name: Commit if changed
        run: |
          git config user.name "logo-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/logos.js
          git diff --cached --quiet || (git commit -m "Update logo list" && git push)
